#   -------------------------------------------  
#   Sample parameters for calibration & imaging
#   -------------------------------------------

#   Directories 

RawDir:       "../rawdata/"
WorkDir:      "../processing/30june2024_b4/"
OutDir:       "../reduced/"

UvMsDir:      "uvms/"                 #   Directory for intermediate UV files (Within WorkDir)
LogDir:       "logs/"                 #   Directory for logs and diagnostics (Within WorkDir)
ImgUvDir:     "imgms/"                #   Directory for UV files for imaging (Within WorkDir)
ImgDir:       "imgs/"                 #   Directory for images (Within WorkDir)


# Data files and field identifiers

RawUvFile:    "SOMETHING_B4_GSB.LTA_RRLL.RRLLFITS"           #   Without .fits
RawFlagFiles: ""                      #   Full paths
ReducedName:  "30june2024_b4"         #   Easier to identify if same string as in WorkDir
TargetName:   "TARGET"                 #   Name of the target field

# Visibility selection 

CorrProds:    "RR,LL"                 #   Correpation products to use
FreqRange:    [593.0, 621.0]          #   Frequency range in MHz


#  Calibration 

SingleChan:   600.0                   #   Single channel frequency in MHz 
FluxCal:      "3C286"                 #   Flux calibrator
PhaseCal:     "1822-096"              #   Phase calibrator
CalUvLim:     "3~40klambda"           #   UV range for calibration
GainInt:      "120s"                  #   Gain solution interval
RefAntenna:   "11"                    #   Reference antenna
MinSNR:       5.0                     #   Minimum SNR
OutThresh:    [7.0, 5.0, 4.0]         #   Outlier thresholds in units of RMS
CalScanEnd:   30.0                    #   Seconds to flag at either end of the calibrator scans

CalIter:      3                       #   Flag-cal iterations 
BpIter:       3                       #   Flag-bandpass iterations 

#   Computing and transformation

FlgThreads:   8                       #   Number of threads for flagging
TarChanAvg:   5                       #   Channel averaging factor for selfcal
FinChanAvg:   5                       #   Channel averaging factor for uvsub
TarUvLim:     "3~200klambda"          #   UV range for the target field


# Imaging and self-calibration

VisList:      null                    #   null --> default generated from ReducedName
#    - "30june2024_b4_J1832"          #   List of visibilities (without .ms) for imaging  

PreModel:     ""                      #   Existing model to use

# Continuum imaging for selfcal 

ImgUvLim:     "3~200klambda"          #   UV range to use for imaging
ImUvTaper:    ["35klambda"]           #   UV taper 

ImgSize:      [3000]                  #   In pixel units [rectangle not yet supported]
CellSize:     ["1.0arcsec"]           #   Pixel size
WprojPln:     100                     #   Number of w-projection planes, -1 for automatic
WtRobust:     0.0                     #   Robust for Briggs weighting 

ImNiter:      3000                    #   Number of iterations
ClnSigma:     10.0                    #   N-sigma threshold for cleaning
DeconScls:    [0, 3, 15]              #   Scales for deconvolution
SclBias:      0.5                     #   Bias towards smaller scales

MaskFile:     ""
                                      #   Pre-existing clean mask
scapp:        "p"                     #   Self-cal approach (p, ap, otherwise normal)

#   Self-cal convergence

PeakThresh:   6.0                     #   Peak threshold for source detecion
IslThresh:    5.0                     #   Island threshold       
CenFrac:      0.05                    #   Fractional box size for source detection    
MaxIter:      5                       #   Maximum iterations for full selfcal
MaxSrcs:      6                       #   Maximum number of sources to compare

TolPos:       1.0                     #   Position tolerance in units of uncertainty
TolPeak:      0.1                     #   Fractional tolerance in peak value
TolRms:       0.2                     #   Fractional tolerance in residual RMS



# Final continuum image

FinImage:     "J1832_30june2024_b4"   #   Name of the final image
FinUvLim:     "3~200klambda"          #   UV range to use for imaging
ImRobust:     0.0                     #   Robust for Briggs weighting 
FiNiter:      5000                    #   Number of iterations
FinSigma:     5.0                     #   N-sigma threshold for cleaning



# Snapshot imaging

CubeDir:      "tcubes/"               #   Directory for cubes (within OutDir)

VisUvSub:     null
#    - "30june2024_b4_J1832"           #   List of visibilities (without .ms) for uvsub imaging

TimgSize:     [32]                    #   In pixel units 
TcellSize:    ["1.0arcsec"]           #   Pixel size
TwprojPln:    1                       #   Number of w-projection planes, -1 for automatic
TwtRobust:    0.5                     #   Robust for Briggs weighting 
TavgChan:     2                       #   Channel averaging for snapshot imaging

TphaseCen:    "J2000 258.20191deg -9.18758deg"   #   Phase centre (blank string --> default)










